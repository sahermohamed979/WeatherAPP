<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="icon" href="./img/logo.png" />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/all.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="./css/media.css" />
  </head>
  <body>
    <main>
      <nav class="navbar navbar-expand-lg py-5" data-bs-theme="dark">
        <div class="container">
          <a class="navbar-brand d-flex" href="#">
            <img
              src="./img/logo.png"
              alt="logo"
              class="w-100 me-3 object-fit-contain"
            />
            <div class="logo">
              <h1 class="title-logo d-flex flex-column">
                Weather <small class="pt-1">tagline goes here</small>
              </h1>
            </div></a
          >

          <button
            class="navbar-toggler text-light ms-auto"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse ms-auto" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item px-4">
                <a
                  class="nav-link text-light active"
                  aria-current="page"
                  href="#"
                  >Home</a
                >
              </li>
              <li class="nav-item px-4">
                <a class="nav-link text-light" href="#">News</a>
              </li>
              <li class="nav-item px-4">
                <a class="nav-link text-light" href="#">Live cameras</a>
              </li>
              <li class="nav-item px-4">
                <a class="nav-link text-light" href="#">Photos</a>
              </li>
              <li class="nav-item px-4">
                <a class="nav-link text-light" href="#">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <section class="py-5 search">
        <div class="container">
          <div class="row">
            <div class="col-md-12">
              <form id="weatherForm" class="d-flex w-100">
                <input
                  type="text"
                  id="cityInput"
                  class="form-control weatherInput text-light"
                  placeholder="Enter city name"
                  oninput="getWeatherCity()"
                  required
                />

                <button type="button" class="btn-search ms-auto">Find</button>
              </form>
            </div>
          </div>
        </div>
      </section>
      <section>
        <div class="forecast-table">
          <div class="container">
            <div class="row">
              <div class="col-12">
                <div class="forecast-container" id="forecast">
                  <div class="row SAHER">
                    <div class="col-12 col-md-4">
                      <div class="today forecast">
                        <div class="forecast-header" id="today">
                          <div class="day"></div>
                          <div class="date"></div>
                        </div>

                        <div class="forecast-content" id="current">
                          <div class="location"></div>
                          <div class="degree">
                            <div class="num"><sup>o</sup>C</div>

                            <div class="forecast-icon">
                              <img src="" alt="" width="90" />
                            </div>
                          </div>
                          <div class="custom"></div>
                          <div>
                            <span class="um"
                              ><img
                                src="./img/icon-umberella.png"
                                alt=""
                                class="me-2"
                              />
                              <h2 class="h6 d-inline-block">%</h2></span
                            >
                            <span class="wind"
                              ><img
                                src="./img/icon-wind.png"
                                alt=""
                                class="me-2"
                              />
                              <h2 class="h6 d-inline-block">km/h</h2></span
                            >
                            <span class="dir"
                              ><img
                                src="./img/icon-compass.png"
                                alt=""
                                class="me-2" />
                              <h2 class="h6 d-inline-block"></h2
                            ></span>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="col-12 col-md-4 sah">
                      <div class="forecast" id="day2">
                        <div class="forecast-header">
                          <div class="day"></div>
                        </div>
                        <div class="forecast-content">
                          <div class="forecast-icon">
                            <img src="" alt="" width="48" />
                          </div>
                          <div class="degree"><sup>o</sup>C</div>
                          <small class="number"><sup>o</sup></small>
                          <div class="custom"></div>
                        </div>
                      </div>
                    </div>
                    <div class="col-12 col-md-4">
                      <div class="forecast" id="day3">
                        <div class="forecast-header">
                          <div class="day"></div>
                        </div>

                        <div class="forecast-content">
                          <div class="forecast-icon">
                            <img src="" alt="" width="48" />
                          </div>
                          <div class="degree"><sup>o</sup>C</div>
                          <small class="number"><sup>o</sup></small>
                          <div class="custom"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <footer class="site-footer">
        <div class="container">
          <div class="row">
            <div class="col-md-8">
              <form action="#" class="subscribe-form">
                <input
                  type="text"
                  placeholder="Enter your email to subscribe..."
                />
                <button type="submit" class="footerSub">Subscribe</button>
              </form>
            </div>
            <div class="col-md-3 col-md-offset-1 ms-auto">
              <div class="social-links">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-google-plus-g"></i></a>
                <a href="#"><i class="fa-brands fa-pinterest-p"></i></a>
              </div>
            </div>
          </div>

          <p class="colophon">
            Copyright 2014 Company name. Designed by Themezy. All rights
            reserved
          </p>
        </div>
      </footer>
    </main>
    <script src="js/index.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
